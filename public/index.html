<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEWS FILTER PRO 2.1</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:1100px;margin:0 auto;padding:24px;background:#f6f7f9;color:#16181d}
h1{margin-bottom:4px}.sub{color:#666;margin-top:0}
form{display:flex;gap:8px;margin:22px 0}input{flex:1;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px}button{padding:13px 18px;border:0;border-radius:10px;cursor:pointer;font-weight:700}
#status{margin:12px 0;color:#555}.card{background:white;border:1px solid #e3e5e8;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 1px 2px #00000008}.meta{color:#666;font-size:14px}.score{font-weight:800}.reasons,.verify{margin-top:8px}.reason{margin:4px 0}.preview{margin-top:10px;line-height:1.55}.url{word-break:break-all;color:#145dbf}.note{background:#fff8dc;padding:14px;border-radius:10px;margin-top:20px}
</style>
</head>
<body>
<h1>NEWS FILTER PRO 2.1</h1>
<p class="sub">뉴스 검색 + 원문 분석 + 출처 확인 + 교차검증 보조</p>
<form id="form"><input id="q" placeholder="검색할 키워드" autocomplete="off"><button>검색</button></form>
<div id="status"></div><div id="results"></div>
<div class="note">⚠️ 이 프로그램은 '가짜뉴스 판정기'가 아닙니다. 점수가 높을수록 사람이 원문과 근거를 더 확인해야 한다는 뜻입니다.</div>
<script>
const form=document.getElementById("form"),q=document.getElementById("q"),status=document.getElementById("status"),results=document.getElementById("results");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
form.addEventListener("submit",async e=>{
 e.preventDefault(); const keyword=q.value.trim(); if(!keyword)return;
 status.textContent="🔎 Google News 검색 및 원문 분석 중..."; results.innerHTML="";
 try{
  const r=await fetch("/api/search?q="+encodeURIComponent(keyword)); const data=await r.json();
  if(!r.ok) throw new Error(data.error||"검색 실패");
  status.textContent="📊 최종 결과: "+data.articles.length+"개";
  results.innerHTML=data.articles.map((a,i)=>`
   <article class="card">
    <div><span>\${esc(a.label)}</span> <span class="score">위험 신호 점수: \${a.score}</span></div>
    <h2>\${i+1}. \${esc(a.title)}</h2>
    <div class="meta">출처: \${esc(a.source||"확인 불가")} · 게시일: \${esc(a.published||"확인 불가")} · 원문 상태: \${esc(a.fetch_status)}</div>
    <p><a class="url" href="\${esc(a.final_url||a.link)}" target="_blank" rel="noopener noreferrer">\${esc(a.final_url||a.link)}</a></p>
    \${a.reasons?.length?`<div class="reasons"><b>주의 신호</b>\${a.reasons.map(x=>`<div class="reason">• \${esc(x)}</div>`).join("")}</div>`:""}
    \${a.verification?.length?`<div class="verify"><b>교차/근거</b>\${a.verification.map(x=>`<div class="reason">• \${esc(x)}</div>`).join("")}</div>`:""}
    \${a.page_text?`<div class="preview"><b>본문 일부</b>: \${esc(a.page_text.slice(0,260))}\${a.page_text.length>260?"...":""}</div>`:""}
   </article>`).join("");
 }catch(err){status.textContent="❌ "+err.message}
});
</script>
</body></html>`;
